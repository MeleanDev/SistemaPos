<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión | Sistema POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #0f172a;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #4f46e5;
            --primary-light: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 15% 15%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(14, 165, 233, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-main);
        }

        .offline-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 3rem 2.25rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .offline-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #4f46e5);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .icon-wrapper {
            width: 88px;
            height: 88px;
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.25rem;
            margin-bottom: 1.5rem;
            position: relative;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(239, 68, 68, 0.3);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(0.95); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.5);
            background: linear-gradient(135deg, #4338ca, #3730a3);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-wifi-slash"></i>
            <div class="pulse-ring"></div>
        </div>

        <h1>Sin Conexión a Internet</h1>
        <p>No tienes acceso a la red en este momento. La aplicación se restablecerá automáticamente en cuanto se detecte conectividad.</p>

        <button class="btn-retry" id="btnRetry" onclick="checkConnection()">
            <i class="fa-solid fa-rotate-right" id="retryIcon"></i>
            <span>Reintentar Conexión</span>
        </button>

        <div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Modo Offline Activo</span>
            </div>
        </div>
    </div>

    <script>
        function checkConnection() {
            const icon = document.getElementById('retryIcon');
            const text = document.getElementById('statusText');
            const dot = document.getElementById('statusDot');
            icon.classList.add('fa-spin');

            setTimeout(() => {
                if (navigator.onLine) {
                    dot.classList.add('online');
                    text.textContent = 'Conexión restablecida. Redirigiendo...';
                    window.location.reload();
                } else {
                    icon.classList.remove('fa-spin');
                    text.textContent = 'Aún sin conexión a Internet';
                }
            }, 600);
        }

        window.addEventListener('online', () => {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.classList.add('online');
            text.textContent = '¡Conexión detectada! Recargando...';
            setTimeout(() => {
                window.location.reload();
            }, 500);
        });
    </script>
</body>
</html>
